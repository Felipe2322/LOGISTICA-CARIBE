<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Página no encontrada | Logística del Caribe</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0F2D5E;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .wrap { max-width: 480px; }
    .truck {
      font-size: 5rem; display: block; margin-bottom: 8px;
      animation: drive 2s ease infinite alternate;
    }
    @keyframes drive {
      from { transform: translateX(-20px); }
      to   { transform: translateX(20px); }
    }
    .code {
      font-size: clamp(5rem, 15vw, 8rem);
      font-weight: 900; color: #F97316;
      line-height: 1; margin-bottom: 8px;
    }
    h1 { color: white; font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; }
    p  { color: rgba(255,255,255,0.55); font-size: 0.95rem; margin-bottom: 32px; line-height: 1.6; }
    .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-home {
      display: inline-flex; align-items: center; gap: 8px;
      background: #F97316; color: white;
      padding: 13px 24px; border-radius: 12px;
      font-weight: 700; font-size: 0.95rem;
      text-decoration: none; transition: background 0.2s;
    }
    .btn-home:hover { background: #EA580C; }
    .btn-wa {
      display: inline-flex; align-items: center; gap: 8px;
      background: #25D366; color: white;
      padding: 13px 24px; border-radius: 12px;
      font-weight: 700; font-size: 0.95rem;
      text-decoration: none; transition: background 0.2s;
    }
    .btn-wa:hover { background: #1ebe5d; }
    .road {
      margin-top: 48px;
      height: 4px; background: rgba(255,255,255,0.1);
      border-radius: 999px; overflow: hidden;
    }
    .road-line {
      height: 100%; width: 30%;
      background: #F97316; border-radius: 999px;
      animation: road 1.5s linear infinite;
    }
    @keyframes road { from { transform: translateX(-100%); } to { transform: translateX(400%); } }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="truck">🚛</span>
    <div class="code">404</div>
    <h1>Esta ruta no existe</h1>
    <p>Parece que el camión tomó el camino equivocado.<br/>La página que buscas no fue encontrada.</p>
    <div class="btns">
      <a href="index.html" class="btn-home"><i class="fas fa-house"></i> Ir al inicio</a>
      <a href="https://wa.me/18090000000" class="btn-wa" target="_blank"><i class="fab fa-whatsapp"></i> Contactar</a>
    </div>
    <div class="road"><div class="road-line"></div></div>
  </div>
</body>
</html>
